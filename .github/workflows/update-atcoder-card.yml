name: Update AtCoder card

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-card:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate card
        run: python scripts/generate_atcoder_card.py

      - name: Commit if changed
        run: |
          if ! git diff --quiet -- assets/atcoder-stats.svg; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add assets/atcoder-stats.svg
            git commit -m "Update AtCoder stats card"
            git push
          else
            echo "No change in AtCoder stats."
          fi
