name: Update stats cards

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate cards
        run: |
          python tooling/scripts/generate_atcoder_card.py
          python tooling/scripts/generate_codechef_card.py

      - name: Commit if changed
        run: |
          if ! git diff --quiet -- tooling/assets/atcoder-stats.svg tooling/assets/codechef-stats.svg; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add tooling/assets/atcoder-stats.svg tooling/assets/codechef-stats.svg
            git commit -m "Update stats cards"
            git push
          else
            echo "No change in stats."
          fi
